[project]
name = "minutes"
version = "0.1.0"
description = "Composable meeting recorder: record both sides, transcribe with pluggable ASR, summarize with Claude"
readme = "README.md"
authors = [
    { name = "daga004" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
minutes = "minutes.cli:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
